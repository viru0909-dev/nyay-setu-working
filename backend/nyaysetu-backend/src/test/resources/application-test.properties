# ---- DEDICATED TEST DATABASE PROFILE FOR E2E WORKFLOW TESTS ----
spring.datasource.url=jdbc:h2:mem:judicial_e2e_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=judicial-e2e-test-secret-key-minimum-256-bits-required-for-testing
jwt.expiration=86400000
cors.allowed.origins=http://localhost:5173

app.frontend.url=http://localhost:5173
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
