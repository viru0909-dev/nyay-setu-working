# ---- "test" PROFILE ----
#
# Activated by @ActiveProfiles("test") on the integration tests. Spring layers
# this file on top of src/test/resources/application.properties, which stays the
# shared base for every test — including the @WebMvcTest slices that never
# activate a profile and that rely on the OAuth2 auto-configuration exclusion
# declared there. Only settings specific to booting a FULL application context
# against a throwaway database belong in this file.
#
# Note that src/test/resources/application.properties shadows the one in
# src/main/resources entirely (target/test-classes precedes target/classes on the
# surefire classpath), so nothing from the production config leaks into tests.

# In-memory, per-JVM, and deliberately never a shared instance: the judicial
# workflow suite files real cases, schedules real hearings and delivers real
# verdicts. The URL matches the base file so that activating this profile changes
# no behaviour for the integration tests that already relied on it.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway is disabled for two reasons: the runtime dependency is
# flyway-database-postgresql, and db/migration currently contains duplicate V51
# and V52 versions, which Flyway rejects outright. Hibernate builds the schema
# from the mapped entities instead, so these tests describe the entity model
# rather than the migration history.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Keep uploads inside the build directory so a test run never writes into the
# working tree.
file.upload-dir=target/test-uploads
app.upload.evidence-path=target/test-uploads/evidence
app.upload.fir-path=target/test-uploads/fir

# Every outbound integration points at a closed port. Nothing in this suite may
# depend on Groq, Bhashini, Ollama, the LawGPT RAG service or the PII NER
# sidecar being reachable; the services under test all degrade to their
# documented offline fallbacks.
groq.api.key=
bhashini.api.key=
lawgpt.service.url=http://localhost:0
ollama.base.url=http://localhost:0
pii.sanitizer.ner-url=http://localhost:0

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
